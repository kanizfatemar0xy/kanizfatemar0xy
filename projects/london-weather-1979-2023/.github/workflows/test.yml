name: Python & notebook validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      # Notebook execution with real ECA&D observations is intentionally not
      # attempted in CI: it requires a separately downloaded, licensed dataset.