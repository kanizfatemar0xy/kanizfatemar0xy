name: GridWorld Q-learning tests
on:
  push:
    paths:
      - 'projects/gridworld-q-learning/**'
      - '.github/workflows/gridworld-qlearning-validation.yml'
  pull_request:
    paths:
      - 'projects/gridworld-q-learning/**'
      - '.github/workflows/gridworld-qlearning-validation.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gridworld-q-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify independent training seeds
        run: python rl_qlearning.py --episodes 3000 --seed 42 --benchmark-seeds 30